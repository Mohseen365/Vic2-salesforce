<template>
    <lightning-card title="Commodity Market List" icon-name="custom:custom93">
        <div slot="actions" class="slds-grid slds-grid_vertical-align-center">
            <lightning-input
                type="search"
                placeholder="Search commodities..."
                variant="label-hidden"
                value={searchKey}
                onchange={handleSearchChange}
                data-testid="search-input"
                class="search-input">
            </lightning-input>
        </div>

        <div class="slds-card__body">
            <!-- Loading State -->
            <template if:true={isLoading}>
                <div class="slds-p-around_medium slds-is-relative spinner-container">
                    <lightning-spinner alternative-text="Loading Commodity List..." size="medium" data-testid="loading-spinner"></lightning-spinner>
                </div>
            </template>

            <!-- Error State -->
            <template if:true={error}>
                <div class="slds-p-around_medium" data-testid="error-message">
                    <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                        <h2>Failed to load commodity list: {errorMessage}</h2>
                    </div>
                </div>
            </template>

            <!-- Datatable -->
            <template if:true={hasProducts}>
                <div class="datatable-wrapper" data-testid="datatable-wrapper">
                    <lightning-datatable
                        key-field="productEconomyId"
                        data={filteredProducts}
                        columns={columns}
                        hide-checkbox-column
                        sorted-by={sortedBy}
                        sorted-direction={sortedDirection}
                        onsort={handleSort}
                        onrowaction={handleRowAction}
                        data-testid="products-datatable">
                    </lightning-datatable>
                </div>
            </template>

            <!-- Empty State -->
            <template if:true={isEmpty}>
                <div class="slds-p-around_large slds-text-align_center" data-testid="empty-message">
                    <div class="slds-text-heading_small slds-text-color_weak">No commodity records found.</div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
