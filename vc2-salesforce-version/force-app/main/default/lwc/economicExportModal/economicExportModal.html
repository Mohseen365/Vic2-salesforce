<template>
    <template if:true={isOpen}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="modal-heading-01"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close"
                        onclick={handleClose}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
                        📥 Export Economic Data
                    </h2>
                    <p class="slds-m-top_x-small slds-text-color_weak slds-text-body_small">
                        Select dataset scope and format for export
                    </p>
                </header>

                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <template if:true={isLoading}>
                        <div class="slds-p-around_large slds-text-align_center">
                            <lightning-spinner alternative-text="Generating export payload..." size="medium"></lightning-spinner>
                            <p class="slds-m-top_medium">Preparing dataset export...</p>
                        </div>
                    </template>

                    <template if:false={isLoading}>
                        <template if:true={errorMessage}>
                            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                                <span class="slds-assistive-text">Error</span>
                                <h2>{errorMessage}</h2>
                            </div>
                        </template>

                        <!-- Scope Selector -->
                        <div class="slds-form-element slds-m-bottom_medium">
                            <lightning-combobox
                                name="exportScope"
                                label="Export Scope"
                                value={selectedScope}
                                options={scopeOptions}
                                onchange={handleScopeChange}
                                data-testid="scope-selector">
                            </lightning-combobox>
                        </div>

                        <!-- Format Selector -->
                        <div class="slds-form-element slds-m-bottom_medium">
                            <lightning-combobox
                                name="exportFormat"
                                label="Export Format"
                                value={selectedFormat}
                                options={formatOptions}
                                disabled
                                data-testid="format-selector">
                            </lightning-combobox>
                        </div>

                        <!-- Row Count & Method Preview Banner -->
                        <div class="slds-card slds-card_boundary slds-p-around_small slds-m-bottom_medium preview-card">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <div class="slds-col slds-has-flexi-truncate">
                                    <p class="slds-text-title_caps slds-text-color_weak">Dataset Preview</p>
                                    <p class="slds-text-heading_small slds-m-top_xx-small">
                                        Estimated Rows: <strong>{previewRowCount}</strong>
                                    </p>
                                </div>
                                <div class="slds-col slds-no-flex">
                                    <span class={processingMethodBadgeClass}>
                                        {processingMethodLabel}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <button
                        class="slds-button slds-button_neutral"
                        onclick={handleClose}
                        disabled={isLoading}
                        data-testid="cancel-button">
                        Cancel
                    </button>
                    <button
                        class="slds-button slds-button_brand"
                        onclick={handleExport}
                        disabled={isExportDisabled}
                        data-testid="export-button">
                        Download CSV
                    </button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-fade-in-open" role="presentation"></div>
    </template>
</template>
