<template>
    <div class="product-dashboard-container">
        <lightning-card title={cardTitle} icon-name="custom:custom93">
            <div slot="actions">
                <lightning-button
                    label="Back to Commodity List"
                    icon-name="utility:back"
                    onclick={handleBackClick}
                    data-testid="back-button">
                </lightning-button>
            </div>

            <div class="slds-card__body slds-card__body_inner">
                <!-- Product Detail Loading State -->
                <template if:true={isLoading}>
                    <div class="slds-p-around_medium slds-is-relative spinner-container">
                        <lightning-spinner alternative-text="Loading Product Detail..." size="medium" data-testid="loading-spinner"></lightning-spinner>
                    </div>
                </template>

                <!-- Product Detail Error State -->
                <template if:true={error}>
                    <div class="slds-p-around_medium" data-testid="error-message">
                        <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                            <h2>Failed to load product details: {errorMessage}</h2>
                        </div>
                    </div>
                </template>

                <!-- Main Product Detail Body -->
                <template if:true={product}>
                    <!-- KPI Cards Grid -->
                    <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_large" data-testid="kpi-grid">
                        <!-- Price -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-p-around_x-small">
                            <div class="kpi-tile slds-box slds-box_x-small slds-text-align_center">
                                <div class="slds-text-title_caps slds-text-color_weak">Market Price</div>
                                <div class="slds-text-heading_medium slds-m-top_x-small" data-testid="kpi-price">
                                    <lightning-formatted-number value={product.price} format-style="currency" currency-code="GBP" maximum-fraction-digits="2"></lightning-formatted-number>
                                </div>
                            </div>
                        </div>

                        <!-- Base Price -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-p-around_x-small">
                            <div class="kpi-tile slds-box slds-box_x-small slds-text-align_center">
                                <div class="slds-text-title_caps slds-text-color_weak">Base Price</div>
                                <div class="slds-text-heading_medium slds-m-top_x-small" data-testid="kpi-base-price">
                                    <lightning-formatted-number value={product.basePrice} format-style="currency" currency-code="GBP" maximum-fraction-digits="2"></lightning-formatted-number>
                                </div>
                            </div>
                        </div>

                        <!-- Inflation % & Badge -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-p-around_x-small">
                            <div class="kpi-tile slds-box slds-box_x-small slds-text-align_center">
                                <div class="slds-text-title_caps slds-text-color_weak">Inflation Rate</div>
                                <div class="slds-m-top_x-small" data-testid="kpi-inflation">
                                    <span class={inflationBadgeClass}>
                                        <lightning-formatted-number value={product.inflationPercent} maximum-fraction-digits="1"></lightning-formatted-number>%
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- Overproduction % & Badge -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-p-around_x-small">
                            <div class="kpi-tile slds-box slds-box_x-small slds-text-align_center">
                                <div class="slds-text-title_caps slds-text-color_weak">Overproduction Rate</div>
                                <div class="slds-m-top_x-small" data-testid="kpi-overproduction">
                                    <span class={overproductionBadgeClass}>
                                        <lightning-formatted-number value={product.overproductionPercent} maximum-fraction-digits="1"></lightning-formatted-number>%
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- World Supply -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-around_x-small">
                            <div class="kpi-tile slds-box slds-box_x-small slds-text-align_center">
                                <div class="slds-text-title_caps slds-text-color_weak">Total World Supply</div>
                                <div class="slds-text-heading_medium slds-m-top_x-small" data-testid="kpi-supply">
                                    <lightning-formatted-number value={product.totalWorldSupply} maximum-fraction-digits="2"></lightning-formatted-number>
                                </div>
                            </div>
                        </div>

                        <!-- Real Demand -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-around_x-small">
                            <div class="kpi-tile slds-box slds-box_x-small slds-text-align_center">
                                <div class="slds-text-title_caps slds-text-color_weak">Real Demand</div>
                                <div class="slds-text-heading_medium slds-m-top_x-small" data-testid="kpi-real-demand">
                                    <lightning-formatted-number value={product.realDemand} maximum-fraction-digits="2"></lightning-formatted-number>
                                </div>
                            </div>
                        </div>

                        <!-- Max Demand -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-around_x-small">
                            <div class="kpi-tile slds-box slds-box_x-small slds-text-align_center">
                                <div class="slds-text-title_caps slds-text-color_weak">Max Demand</div>
                                <div class="slds-text-heading_medium slds-m-top_x-small" data-testid="kpi-max-demand">
                                    <lightning-formatted-number value={product.maxDemand} maximum-fraction-digits="2"></lightning-formatted-number>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Country Contributions Sub-Table -->
                    <div class="slds-card slds-card_boundary">
                        <div class="slds-card__header slds-p-around_small">
                            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                <div class="slds-media__body">
                                    <h2 class="slds-card__header-title slds-text-heading_small">
                                        Country Breakdown & GDP Contributions for {productCodeDisplay}
                                    </h2>
                                </div>
                            </header>
                        </div>

                        <div class="slds-card__body">
                            <template if:true={isCountriesLoading}>
                                <div class="slds-p-around_medium slds-is-relative spinner-container">
                                    <lightning-spinner alternative-text="Loading Country Breakdown..." size="medium" data-testid="subtable-spinner"></lightning-spinner>
                                </div>
                            </template>

                            <template if:true={hasCountryContributions}>
                                <div class="subtable-wrapper" data-testid="subtable-wrapper">
                                    <lightning-datatable
                                        key-field="junctionId"
                                        data={countryContributions}
                                        columns={subTableColumns}
                                        hide-checkbox-column
                                        sorted-by={subSortedBy}
                                        sorted-direction={subSortedDirection}
                                        onsort={handleSubSort}
                                        data-testid="subtable">
                                    </lightning-datatable>
                                </div>
                            </template>

                            <template if:true={isCountriesEmpty}>
                                <div class="slds-p-around_large slds-text-align_center" data-testid="no-subtable-data">
                                    <div class="slds-text-heading_small slds-text-color_weak">No country trade contributions recorded for this commodity.</div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </lightning-card>
    </div>
</template>
