<template>
    <lightning-card title="Economic Visualizations & Analytics" icon-name="utility:chart">
        <div class="slds-p-horizontal_medium chart-card">
            <!-- Loading State -->
            <template if:true={isLoading}>
                <div class="slds-p-around_large slds-text-align_center">
                    <lightning-spinner alternative-text="Loading economic chart data..." size="medium"></lightning-spinner>
                    <p class="slds-m-top_medium slds-text-color_weak">Loading economic visualizations...</p>
                </div>
            </template>

            <!-- Error State -->
            <template if:true={errorMessage}>
                <div class="slds-m-bottom_medium">
                    <div class="slds-scoped-notification slds-media slds-media_center slds-theme_error" role="status">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="utility:error" alternative-text="Error" variant="inverse" size="small"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <p>{errorMessage}</p>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Empty / No Selection State -->
            <template if:false={hasData}>
                <template if:false={isLoading}>
                    <div class="slds-p-around_large slds-text-align_center">
                        <p class="slds-text-heading_small slds-text-color_weak" data-testid="empty-chart-message">
                            No analysis data available to render charts. Please select an economy analysis.
                        </p>
                    </div>
                </template>
            </template>

            <!-- Active Chart Container -->
            <template if:true={hasData}>
                <lightning-tabset variant="scoped" active-tab-value="gdp-distribution" onselect={handleTabSelect} data-testid="chart-tabset">
                    <!-- Tab 1: GDP Distribution (Donut Chart) -->
                    <lightning-tab label="📊 GDP Share Distribution" value="gdp-distribution" data-testid="tab-gdp-donut">
                        <div class="slds-m-top_medium slds-text-align_center">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">Top Countries by World GDP Share</h3>
                            <div class="svg-container">
                                <svg viewBox="0 0 400 400" width="100%" height="320" aria-label="Donut chart showing GDP distribution of top countries" role="img">
                                    <template for:each={gdpDonutData.slices} for:item="slice">
                                        <path
                                            key={slice.label}
                                            d={slice.path}
                                            fill={slice.color}
                                            class="donut-slice"
                                            aria-label={slice.ariaLabel}>
                                            <title>{slice.fullLabel}: {slice.formattedPercent} ({slice.formattedGdp})</title>
                                        </path>
                                    </template>
                                </svg>
                            </div>

                            <!-- Legend -->
                            <div class="legend-list slds-m-top_small">
                                <template for:each={gdpDonutData.legend} for:item="item">
                                    <div key={item.label} class="legend-item">
                                        <span class="legend-swatch" style={item.colorStyle}></span>
                                        <span><strong>{item.label}:</strong> {item.formattedPercent}</span>
                                    </div>
                                </template>
                            </div>

                            <!-- Accessible Screen Reader Fallback Table -->
                            <div class="slds-assistive-text">
                                <table>
                                    <caption>Top Countries by World GDP Share</caption>
                                    <thead>
                                        <tr><th>Country</th><th>GDP</th><th>Share</th></tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={gdpDonutData.slices} for:item="slice">
                                            <tr key={slice.label}>
                                                <td>{slice.fullLabel}</td>
                                                <td>{slice.formattedGdp}</td>
                                                <td>{slice.formattedPercent}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </lightning-tab>

                    <!-- Tab 2: Trade Balance (Imports vs Exports Grouped Bar Chart) -->
                    <lightning-tab label="⚖️ Trade Balance" value="trade-balance" data-testid="tab-trade-balance">
                        <div class="slds-m-top_medium slds-text-align_center">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">Top 10 Countries Trade Balance (Imports vs Exports)</h3>
                            <div class="svg-container">
                                <svg viewBox="0 0 780 300" width="100%" height="300" aria-label="Grouped bar chart comparing imports and exports for top 10 countries" role="img">
                                    <!-- Axes & Grid -->
                                    <line x1="50" y1="260" x2="750" y2="260" class="chart-axis-line"></line>
                                    <line x1="50" y1="40" x2="50" y2="260" class="chart-axis-line"></line>
                                    <text x="45" y="45" text-anchor="end" class="chart-label">{tradeBalanceData.formattedMax}</text>
                                    <text x="45" y="260" text-anchor="end" class="chart-label">£0</text>

                                    <!-- Bars -->
                                    <template for:each={tradeBalanceData.bars} for:item="bar">
                                        <g key={bar.countryTag}>
                                            <!-- Import Bar (Blue) -->
                                            <rect x={bar.xImport} y={bar.yImport} width="20" height={bar.importHeight} fill="#1B96FF" class="chart-bar" aria-label={bar.ariaLabel}>
                                                <title>{bar.countryName} Imports: {bar.formattedImports}</title>
                                            </rect>
                                            <!-- Export Bar (Green) -->
                                            <rect x={bar.xExport} y={bar.yExport} width="20" height={bar.exportHeight} fill="#04844B" class="chart-bar" aria-label={bar.ariaLabel}>
                                                <title>{bar.countryName} Exports: {bar.formattedExports}</title>
                                            </rect>
                                            <!-- X Axis Tag Label -->
                                            <text x={bar.xGroup} y="280" class="chart-label-bold">{bar.countryTag}</text>
                                        </g>
                                    </template>
                                </svg>
                            </div>
                            <!-- Legend -->
                            <div class="legend-list slds-m-top_small">
                                <div class="legend-item"><span class="legend-swatch" style="background-color: #1B96FF;"></span> Total Imports</div>
                                <div class="legend-item"><span class="legend-swatch" style="background-color: #04844B;"></span> Total Exports</div>
                            </div>
                        </div>
                    </lightning-tab>

                    <!-- Tab 3: Country GDP Comparison (Horizontal Bar Chart) -->
                    <lightning-tab label="🏛️ Country GDP Comparison" value="country-gdp" data-testid="tab-country-gdp">
                        <div class="slds-m-top_medium slds-text-align_center">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">Top 10 Economies by Total GDP</h3>
                            <div class="svg-container">
                                <svg viewBox="0 0 680 360" width="100%" height="340" aria-label="Horizontal bar chart comparing GDP of top 10 countries" role="img">
                                    <line x1="80" y1="20" x2="80" y2="340" class="chart-axis-line"></line>
                                    <template for:each={countryGdpData.bars} for:item="bar">
                                        <g key={bar.countryTag}>
                                            <text x="70" y={bar.y} text-anchor="end" class="chart-label-bold">{bar.countryTag}</text>
                                            <rect x="85" y={bar.y} width={bar.width} height="18" fill={bar.color} class="chart-bar" aria-label={bar.ariaLabel}>
                                                <title>{bar.countryName}: {bar.formattedGdp}</title>
                                            </rect>
                                        </g>
                                    </template>
                                </svg>
                            </div>
                        </div>
                    </lightning-tab>

                    <!-- Tab 4: Product Supply vs Demand (Grouped Bar Chart) -->
                    <lightning-tab label="📦 Supply vs Demand" value="product-supply-demand" data-testid="tab-product-sd">
                        <div class="slds-m-top_medium slds-text-align_center">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">Top 15 Commodities: Supply vs Real Demand vs Max Demand</h3>
                            <div class="svg-container">
                                <svg viewBox="0 0 800 300" width="100%" height="300" aria-label="Bar chart comparing supply and demand for top commodities" role="img">
                                    <line x1="45" y1="260" x2="780" y2="260" class="chart-axis-line"></line>
                                    <template for:each={productSupplyDemandData.bars} for:item="bar">
                                        <g key={bar.productCode}>
                                            <rect x={bar.xSupply} y={bar.ySupply} width="10" height={bar.supplyH} fill="#1B96FF" class="chart-bar" aria-label={bar.ariaLabel}>
                                                <title>{bar.productCode} Supply: {bar.formattedSupply}</title>
                                            </rect>
                                            <rect x={bar.xReal} y={bar.yReal} width="10" height={bar.realH} fill="#FFB75D" class="chart-bar" aria-label={bar.ariaLabel}>
                                                <title>{bar.productCode} Real Demand: {bar.formattedReal}</title>
                                            </rect>
                                            <rect x={bar.xMax} y={bar.yMax} width="10" height={bar.maxH} fill="#C23934" class="chart-bar" aria-label={bar.ariaLabel}>
                                                <title>{bar.productCode} Max Demand: {bar.formattedMax}</title>
                                            </rect>
                                            <text x={bar.xGroup} y="280" class="chart-label">{bar.productCode}</text>
                                        </g>
                                    </template>
                                </svg>
                            </div>
                            <!-- Legend -->
                            <div class="legend-list slds-m-top_small">
                                <div class="legend-item"><span class="legend-swatch" style="background-color: #1B96FF;"></span> World Supply</div>
                                <div class="legend-item"><span class="legend-swatch" style="background-color: #FFB75D;"></span> Real Demand</div>
                                <div class="legend-item"><span class="legend-swatch" style="background-color: #C23934;"></span> Max Demand</div>
                            </div>
                        </div>
                    </lightning-tab>

                    <!-- Tab 5: Inflation vs Overproduction (Scatter Plot) -->
                    <lightning-tab label="📈 Inflation vs Overproduction" value="inflation-overproduction" data-testid="tab-scatter">
                        <div class="slds-m-top_medium slds-text-align_center">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">Commodity Market Position (Inflation % vs Overproduction %)</h3>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">Dot size represents relative Total World Supply</p>
                            <div class="svg-container">
                                <svg viewBox="0 0 680 300" width="100%" height="300" aria-label="Scatter plot of inflation versus overproduction per commodity" role="img">
                                    <!-- Axes -->
                                    <line x1="50" y1="250" x2="630" y2="250" class="chart-axis-line"></line>
                                    <line x1="340" y1="20" x2="340" y2="250" class="chart-axis-line"></line>
                                    <!-- Quadrant Labels -->
                                    <text x="60" y="35" class="chart-label">Overproduced / Deflation</text>
                                    <text x="480" y="35" class="chart-label">Overproduced / Inflation</text>
                                    <text x="60" y="240" class="chart-label">Shortage / Deflation</text>
                                    <text x="480" y="240" class="chart-label">Shortage / Inflation</text>
                                    <text x="340" y="270" text-anchor="middle" class="chart-label-bold">Inflation Rate (%)</text>

                                    <!-- Points -->
                                    <template for:each={scatterData.points} for:item="pt">
                                        <circle
                                            key={pt.productCode}
                                            cx={pt.cx}
                                            cy={pt.cy}
                                            r={pt.r}
                                            fill="#0070D2"
                                            class="scatter-point"
                                            aria-label={pt.ariaLabel}>
                                            <title>{pt.productName} ({pt.productCode}): Inflation {pt.formattedInf}, Overproduction {pt.formattedOverp}, Supply {pt.formattedSupply}</title>
                                        </circle>
                                    </template>
                                </svg>
                            </div>
                        </div>
                    </lightning-tab>
                </lightning-tabset>
            </template>
        </div>
    </lightning-card>
</template>
