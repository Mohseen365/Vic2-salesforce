<template>
    <lightning-card icon-name="custom:custom68">
        <div slot="title" class="slds-flex slds-grid_vertical-align-center slds-has-flexi-truncate">
            <span class="slds-truncate header-title" title={saveFileNameDisplay}>
                {saveFileNameDisplay}
            </span>
            <template if:true={ingameDateDisplay}>
                <span class="slds-m-left_small slds-text-color_weak slds-text-title">
                    ({ingameDateDisplay})
                </span>
            </template>
        </div>

        <div slot="actions" class="slds-grid slds-grid_vertical-align-center">
            <template if:true={playerCountryTagDisplay}>
                <span class="slds-m-right_medium slds-badge slds-theme_alt-inverse">
                    Player: {playerCountryTagDisplay}
                </span>
            </template>
            <template if:true={statusDisplay}>
                <span class={statusBadgeClass} data-testid="status-badge">
                    {statusDisplay}
                </span>
            </template>
            <template if:true={showRefreshButton}>
                <lightning-button-icon
                    icon-name="utility:refresh"
                    alternative-text="Refresh"
                    title="Refresh Analysis Data"
                    onclick={handleRefresh}
                    class="slds-m-left_small"
                    data-testid="refresh-button">
                </lightning-button-icon>
            </template>
            <template if:true={summary}>
                <lightning-button
                    label="Export"
                    icon-name="utility:download"
                    title="Export Economic Data"
                    onclick={handleOpenExport}
                    class="slds-m-left_x-small"
                    data-testid="export-button">
                </lightning-button>
            </template>
        </div>

        <!-- Loading State -->
        <template if:true={isLoading}>
            <div class="slds-p-around_medium slds-is-relative spinner-container">
                <lightning-spinner alternative-text="Loading Analysis Header..." size="medium" data-testid="loading-spinner"></lightning-spinner>
            </div>
        </template>

        <!-- Error State -->
        <template if:true={error}>
            <div class="slds-p-around_medium" data-testid="error-message">
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <h2>Failed to load economy analysis summary: {errorMessage}</h2>
                </div>
            </div>
        </template>

        <!-- Main Body Content -->
        <template if:true={summary}>
            <div class="slds-card__body slds-card__body_inner">
                <!-- Failed Diagnostic Banner -->
                <template if:true={isFailed}>
                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert" data-testid="diagnostic-banner">
                        <span class="slds-assistive-text">Import Failure</span>
                        <h2>Import Failed: {diagnosticMessage}</h2>
                    </div>
                </template>

                <!-- Processing / Calculating Pending Banner -->
                <template if:true={isPending}>
                    <div class="slds-notify slds-notify_alert slds-theme_warning slds-m-bottom_medium" role="alert" data-testid="pending-banner">
                        <span class="slds-assistive-text">Warning</span>
                        <h2>Import or calculation in progress. Derived values may be incomplete. Click Refresh to check status.</h2>
                    </div>
                </template>

                <!-- KPI Tiles Grid -->
                <div class="slds-grid slds-gutters slds-wrap">
                    <!-- World GDP -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-p-around_x-small">
                        <div class="kpi-card slds-box slds-box_x-small slds-text-align_center">
                            <div class="slds-text-title_caps slds-text-color_weak">Total World GDP</div>
                            <div class="slds-text-heading_medium slds-m-top_x-small" data-testid="world-gdp">
                                <lightning-formatted-number
                                    value={summary.totalWorldGdp}
                                    format-style="currency"
                                    currency-code="GBP"
                                    maximum-fraction-digits="2">
                                </lightning-formatted-number>
                            </div>
                        </div>
                    </div>

                    <!-- World Population -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-p-around_x-small">
                        <div class="kpi-card slds-box slds-box_x-small slds-text-align_center">
                            <div class="slds-text-title_caps slds-text-color_weak">Total World Population</div>
                            <div class="slds-text-heading_medium slds-m-top_x-small" data-testid="world-population">
                                <lightning-formatted-number
                                    value={summary.totalWorldPopulation}
                                    maximum-fraction-digits="0">
                                </lightning-formatted-number>
                            </div>
                        </div>
                    </div>

                    <!-- World Imports -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-p-around_x-small">
                        <div class="kpi-card slds-box slds-box_x-small slds-text-align_center">
                            <div class="slds-text-title_caps slds-text-color_weak">Total World Imports</div>
                            <div class="slds-text-heading_medium slds-m-top_x-small" data-testid="world-imports">
                                <lightning-formatted-number
                                    value={summary.totalWorldImports}
                                    format-style="currency"
                                    currency-code="GBP"
                                    maximum-fraction-digits="2">
                                </lightning-formatted-number>
                            </div>
                        </div>
                    </div>

                    <!-- World Exports -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-p-around_x-small">
                        <div class="kpi-card slds-box slds-box_x-small slds-text-align_center">
                            <div class="slds-text-title_caps slds-text-color_weak">Total World Exports</div>
                            <div class="slds-text-heading_medium slds-m-top_x-small" data-testid="world-exports">
                                <lightning-formatted-number
                                    value={summary.totalWorldExports}
                                    format-style="currency"
                                    currency-code="GBP"
                                    maximum-fraction-digits="2">
                                </lightning-formatted-number>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
