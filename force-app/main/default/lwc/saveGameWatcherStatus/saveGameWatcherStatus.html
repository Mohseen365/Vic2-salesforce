<template>
    <div class="slds-flex slds-items-center">
        <!-- Status Pill / Badge -->
        <span class={badgeClass} title={badgeTooltip}>
            <span class="slds-badge__icon slds-badge__icon_left">
                <lightning-icon
                    icon-name={badgeIcon}
                    size="x-small"
                    variant="inverse">
                </lightning-icon>
            </span>
            {badgeLabel}
        </span>

        <!-- Fallback Manual Refresh Button if EMP API is unavailable or user wants manual refresh -->
        <template if:true={isEmpUnavailable}>
            <lightning-button-icon
                icon-name="utility:refresh"
                alternative-text="Manual Refresh"
                title="empApi Unavailable - Click to Refresh"
                size="small"
                class="slds-m-left_x-small"
                onclick={handleManualRefresh}>
            </lightning-button-icon>
        </template>
    </div>
</template>
