<template>
    <div
        class={tileCssClass}
        onclick={handleTileClick}
        role="button"
        tabindex="0"
        title={computedTitle}
        data-testid="kpi-tile-container">
        <div class="kpi-header slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_xx-small">
            <span class="kpi-label slds-truncate slds-text-color_weak" title={label}>
                <template if:true={iconName}>
                    <lightning-icon icon-name={iconName} size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                </template>
                {label}
            </span>
            <template if:true={statusDotClass}>
                <span class={statusDotClass} title={statusTooltip}></span>
            </template>
        </div>

        <div class="kpi-body slds-grid slds-grid_align-spread slds-grid_vertical-align-end">
            <div class="kpi-values">
                <div class="kpi-value slds-text-heading_medium slds-truncate" data-testid="kpi-value">
                    {formattedValue}
                </div>
                <div class={deltaCssClass} data-testid="kpi-delta">
                    <span class="delta-arrow">{deltaArrow}</span>
                    <span>{formattedDelta}</span>
                </div>
            </div>

            <template if:true={hasSparkline}>
                <div class="kpi-sparkline" data-testid="kpi-sparkline">
                    <svg viewBox="0 0 80 24" class="sparkline-svg" aria-label="Trend sparkline">
                        <path d={sparklinePath} fill="none" class={sparklineLineClass} stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </div>
            </template>
        </div>
    </div>
</template>
