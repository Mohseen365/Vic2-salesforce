<template>
    <lightning-card title="Factory Explorer" icon-name="standard:asset_mgmt">
        <div class="slds-p-around_medium">
            <!-- Search & Filters -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-3">
                    <lightning-input
                        type="search"
                        label="Search Factories"
                        placeholder="Filter by building type, state, or country..."
                        value={searchTerm}
                        onchange={handleSearchChange}>
                    </lightning-input>
                </div>
            </div>

            <!-- KPI Summary Cards -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-box_x-small slds-text-align_center slds-theme_shade">
                        <div class="slds-text-color_weak slds-text-title_caps">Total Factories</div>
                        <div class="slds-text-heading_medium">{totalFactories}</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-box_x-small slds-text-align_center slds-theme_shade">
                        <div class="slds-text-color_weak slds-text-title_caps">Total Employees</div>
                        <div class="slds-text-heading_medium">{formattedTotalEmployees}</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-box_x-small slds-text-align_center slds-theme_shade">
                        <div class="slds-text-color_weak slds-text-title_caps">Total Factory GDP</div>
                        <div class="slds-text-heading_medium">{formattedTotalFactoryGdp}</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-box_x-small slds-text-align_center slds-theme_shade">
                        <div class="slds-text-color_weak slds-text-title_caps">Total Profit</div>
                        <div class="slds-text-heading_medium">{formattedTotalProfit}</div>
                    </div>
                </div>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alt-text="Loading factory data..."></lightning-spinner>
            </template>

            <!-- Datatable -->
            <template if:true={hasFactories}>
                <div style="height: 400px;">
                    <lightning-datatable
                        key-field="id"
                        data={filteredFactories}
                        columns={columns}
                        hide-checkbox-column
                        default-sort-direction="asc"
                        sorted-by={sortedBy}
                        sorted-direction={sortDirection}
                        onsort={handleSort}>
                    </lightning-datatable>
                </div>
            </template>

            <!-- Empty State -->
            <template if:false={hasFactories}>
                <template if:false={isLoading}>
                    <div class="slds-text-align_center slds-p-around_large slds-text-color_weak">
                        No factory economic data found for this selection.
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
