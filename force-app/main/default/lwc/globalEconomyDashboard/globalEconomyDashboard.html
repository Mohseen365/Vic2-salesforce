<template>
    <div class="global-dashboard-container">
        <!-- Loading State -->
        <template if:true={isLoading}>
            <div class="slds-p-around_large slds-text-align_center">
                <lightning-spinner alternative-text="Loading Global Overview Data..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Stale / Pending Analysis Warning Banner -->
        <template if:true={isStaleOrPending}>
            <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                <span class="slds-assistive-text">warning</span>
                <lightning-icon icon-name="utility:warning" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                <h2>
                    Analysis status is <strong>{analysisSummary.importStatus}</strong>. Metrics displayed may be incomplete or updating.
                </h2>
            </div>
        </template>

        <!-- Error State -->
        <template if:true={errorMessage}>
            <lightning-card title="Global Overview Error" icon-name="utility:error" class="slds-card_boundary">
                <div class="slds-p-around_medium slds-text-color_error">
                    <p>{errorMessage}</p>
                </div>
            </lightning-card>
        </template>

        <!-- Main Dashboard View -->
        <template if:true={hasData}>
            <!-- KPI Cards Grid -->
            <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium" data-testid="kpi-grid">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-large-size_1-of-6 slds-m-bottom_small">
                    <div class="slds-box slds-box_x-small slds-text-align_center kpi-card">
                        <p class="slds-text-title_caps slds-text-color_weak">World GDP</p>
                        <p class="slds-text-heading_medium slds-truncate" title={formattedGdp}>{formattedGdp}</p>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-large-size_1-of-6 slds-m-bottom_small">
                    <div class="slds-box slds-box_x-small slds-text-align_center kpi-card">
                        <p class="slds-text-title_caps slds-text-color_weak">World Population</p>
                        <p class="slds-text-heading_medium slds-truncate" title={formattedPopulation}>{formattedPopulation}</p>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-large-size_1-of-6 slds-m-bottom_small">
                    <div class="slds-box slds-box_x-small slds-text-align_center kpi-card">
                        <p class="slds-text-title_caps slds-text-color_weak">World Imports</p>
                        <p class="slds-text-heading_medium slds-truncate" title={formattedImports}>{formattedImports}</p>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-large-size_1-of-6 slds-m-bottom_small">
                    <div class="slds-box slds-box_x-small slds-text-align_center kpi-card">
                        <p class="slds-text-title_caps slds-text-color_weak">World Exports</p>
                        <p class="slds-text-heading_medium slds-truncate" title={formattedExports}>{formattedExports}</p>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-large-size_1-of-6 slds-m-bottom_small">
                    <div class="slds-box slds-box_x-small slds-text-align_center kpi-card">
                        <p class="slds-text-title_caps slds-text-color_weak">Top Great Power</p>
                        <p class="slds-text-heading_medium slds-truncate" title={topGreatPower}>{topGreatPower}</p>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-large-size_1-of-6 slds-m-bottom_small">
                    <div class="slds-box slds-box_x-small slds-text-align_center kpi-card">
                        <p class="slds-text-title_caps slds-text-color_weak">Products Monitored</p>
                        <p class="slds-text-heading_medium slds-truncate" title={productsCount}>{productsCount}</p>
                    </div>
                </div>
            </div>

            <!-- Datatables Grid: Top 10 Countries & Top 10 Products -->
            <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
                <!-- Top 10 Countries -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-m-bottom_medium">
                    <lightning-card title="🏛️ Top 10 World Powers by GDP" icon-name="standard:address" class="slds-card_boundary">
                        <div style="height: 320px;" data-testid="top-countries-table">
                            <lightning-datatable
                                key-field="countryEconomyId"
                                data={topCountries}
                                columns={countryColumns}
                                hide-checkbox-column
                                onrowaction={handleCountryRowAction}>
                            </lightning-datatable>
                        </div>
                    </lightning-card>
                </div>

                <!-- Top 10 Products -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-m-bottom_medium">
                    <lightning-card title="📦 Top 10 Commodities by World Supply" icon-name="standard:product" class="slds-card_boundary">
                        <div style="height: 320px;" data-testid="top-products-table">
                            <lightning-datatable
                                key-field="productEconomyId"
                                data={topProducts}
                                columns={productColumns}
                                hide-checkbox-column
                                onrowaction={handleProductRowAction}>
                            </lightning-datatable>
                        </div>
                    </lightning-card>
                </div>
            </div>

            <!-- Embedded Visualizations Section -->
            <lightning-card title="📈 Global Visualizations" icon-name="standard:chart" class="slds-card_boundary">
                <div class="slds-p-around_medium">
                    <c-economic-charts-container
                        analysis-id={analysisId}
                        data-testid="global-charts-container">
                    </c-economic-charts-container>
                </div>
            </lightning-card>
        </template>

        <!-- Empty State -->
        <template if:true={isEmpty}>
            <lightning-card title="Global Overview" icon-name="custom:custom62" class="slds-card_boundary">
                <div class="slds-p-around_large slds-text-align_center">
                    <p class="slds-text-heading_small slds-text-color_weak">
                        No analysis data available. Please select a save file analysis above.
                    </p>
                </div>
            </lightning-card>
        </template>
    </div>
</template>
