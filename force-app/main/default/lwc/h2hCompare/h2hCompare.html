<template>
    <div class="h2h-container slds-card slds-p-around_medium">
        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_large">
            <div class="slds-grid slds-grid_vertical-align-center">
                <lightning-icon icon-name="utility:metrics" size="medium" class="slds-m-right_small"></lightning-icon>
                <div>
                    <h2 class="slds-text-heading_medium slds-font-weight_bold">Head-to-Head Player Scorecard</h2>
                    <p class="slds-text-body_small slds-text-color_weak">Side-by-side battle bar comparison between two player save game snapshots.</p>
                </div>
            </div>
            <span class="slds-badge slds-theme_info">RSK-14 Read-Only Protected</span>
        </div>

        <!-- Player Selection Controls -->
        <div class="slds-grid slds-gutters slds-m-bottom_large">
            <div class="slds-col slds-size_1-of-2">
                <div class="player-selector-box player-a-box slds-p-around_small">
                    <h4 class="slds-text-title_bold slds-m-bottom_xx-small text-player-a">Player A Campaign</h4>
                    <lightning-combobox
                        name="playerA"
                        label="Select Save File A"
                        value={baseSnapshotId}
                        options={snapshotOptions}
                        onchange={handleBaseChange}>
                    </lightning-combobox>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2">
                <div class="player-selector-box player-b-box slds-p-around_small">
                    <h4 class="slds-text-title_bold slds-m-bottom_xx-small text-player-b">Player B Campaign</h4>
                    <lightning-combobox
                        name="playerB"
                        label="Select Save File B"
                        value={compareSnapshotId}
                        options={snapshotOptions}
                        onchange={handleCompareChange}>
                    </lightning-combobox>
                </div>
            </div>
        </div>

        <!-- Battle Bar Scorecard Grid -->
        <template if:true={hasData}>
            <div class="scorecard-grid">
                <template for:each={scorecardRows} for:item="row">
                    <div key={row.metricKey} class="scorecard-row slds-m-bottom_medium">
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                            <span class="val-a slds-font-weight_bold">{row.valAFormatted}</span>
                            <span class="metric-title slds-text-title_bold">{row.title}</span>
                            <span class="val-b slds-font-weight_bold">{row.valBFormatted}</span>
                        </div>

                        <!-- Dual Battle Bar Gauge -->
                        <div class="battle-bar-track slds-grid">
                            <div class="bar-a" style={row.barAStyle}></div>
                            <div class="bar-b" style={row.barBStyle}></div>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <template if:false={hasData}>
            <div class="slds-text-align_center slds-p-around_large slds-text-color_weak">
                Please select two distinct save snapshots above to populate the Head-to-Head scorecard.
            </div>
        </template>
    </div>
</template>
