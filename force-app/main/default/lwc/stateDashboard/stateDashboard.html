<template>
    <lightning-card title="State Explorer" icon-name="standard:address">
        <div class="slds-p-around_medium">
            <!-- Search & Filters -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-3">
                    <lightning-input
                        type="search"
                        label="Search States"
                        placeholder="Filter by state code or country tag..."
                        value={searchTerm}
                        onchange={handleSearchChange}>
                    </lightning-input>
                </div>
            </div>

            <!-- KPI Summary Cards -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-box_x-small slds-text-align_center slds-theme_shade">
                        <div class="slds-text-color_weak slds-text-title_caps">Total State GDP</div>
                        <div class="slds-text-heading_medium">{formattedTotalGdp}</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-box_x-small slds-text-align_center slds-theme_shade">
                        <div class="slds-text-color_weak slds-text-title_caps">Total Population</div>
                        <div class="slds-text-heading_medium">{formattedTotalPopulation}</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-box_x-small slds-text-align_center slds-theme_shade">
                        <div class="slds-text-color_weak slds-text-title_caps">Total Factory GDP</div>
                        <div class="slds-text-heading_medium">{formattedTotalFgdp}</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-box_x-small slds-text-align_center slds-theme_shade">
                        <div class="slds-text-color_weak slds-text-title_caps">Factory Employees</div>
                        <div class="slds-text-heading_medium">{formattedTotalEmployees}</div>
                    </div>
                </div>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alt-text="Loading state data..."></lightning-spinner>
            </template>

            <!-- Datatable -->
            <template if:true={hasStates}>
                <div style="height: 400px;">
                    <lightning-datatable
                        key-field="id"
                        data={filteredStates}
                        columns={columns}
                        hide-checkbox-column
                        default-sort-direction="asc"
                        sorted-by={sortedBy}
                        sorted-direction={sortDirection}
                        onsort={handleSort}
                        onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
            </template>

            <!-- Empty State -->
            <template if:false={hasStates}>
                <template if:false={isLoading}>
                    <div class="slds-text-align_center slds-p-around_large slds-text-color_weak">
                        No state economic data found for this analysis.
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
